<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="50%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#2d527c" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c45d38" />
      <stop offset="50%" stop-color="#d97746" />
      <stop offset="100%" stop-color="#b8502b" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>
  
  <!-- Subtle warm sunset glow -->
  <circle cx="600" cy="500" r="450" fill="#f59e0b" opacity="0.08" />

  <!-- Ground / Lawn -->
  <rect y="620" width="1200" height="180" fill="#2d503b" />
  <rect y="640" width="1200" height="160" fill="#223f2f" />
  
  <!-- Front Pathway -->
  <polygon points="520,620 680,620 740,800 460,800" fill="#cbd5e1" opacity="0.9" />
  <line x1="600" y1="620" x2="600" y2="800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- Main Sanctuary Building -->
  <!-- Left Wing -->
  <rect x="220" y="440" width="230" height="180" fill="url(#brickGrad)" rx="2"/>
  <polygon points="210,440 335,350 460,440" fill="url(#roofGrad)" />
  <!-- Left Windows -->
  <rect x="255" y="470" width="40" height="80" rx="20" fill="#fef3c7" opacity="0.85" stroke="#78350f" stroke-width="3"/>
  <line x1="275" y1="470" x2="275" y2="550" stroke="#78350f" stroke-width="2"/>
  <line x1="255" y1="510" x2="295" y2="510" stroke="#78350f" stroke-width="2"/>

  <rect x="335" y="470" width="40" height="80" rx="20" fill="#fef3c7" opacity="0.85" stroke="#78350f" stroke-width="3"/>
  <line x1="355" y1="470" x2="355" y2="550" stroke="#78350f" stroke-width="2"/>
  <line x1="335" y1="510" x2="375" y2="510" stroke="#78350f" stroke-width="2"/>

  <!-- Right Wing -->
  <rect x="750" y="440" width="230" height="180" fill="url(#brickGrad)" rx="2"/>
  <polygon points="740,440 865,350 990,440" fill="url(#roofGrad)" />
  <!-- Right Windows -->
  <rect x="785" y="470" width="40" height="80" rx="20" fill="#fef3c7" opacity="0.85" stroke="#78350f" stroke-width="3"/>
  <line x1="805" y1="470" x2="805" y2="550" stroke="#78350f" stroke-width="2"/>
  <line x1="785" y1="510" x2="825" y2="510" stroke="#78350f" stroke-width="2"/>

  <rect x="865" y="470" width="40" height="80" rx="20" fill="#fef3c7" opacity="0.85" stroke="#78350f" stroke-width="3"/>
  <line x1="885" y1="470" x2="885" y2="550" stroke="#78350f" stroke-width="2"/>
  <line x1="865" y1="510" x2="905" y2="510" stroke="#78350f" stroke-width="2"/>

  <!-- Center Sanctuary / Portico -->
  <rect x="420" y="380" width="360" height="240" fill="#e2e8f0" rx="4"/>
  
  <!-- Classic Portico Pediment (Triangle Roof) -->
  <polygon points="390,380 600,220 810,380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  <polygon points="410,370 600,235 790,370" fill="#e2e8f0" />
  
  <!-- Steeple / Spire -->
  <rect x="565" y="140" width="70" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="560,140 600,30 640,140" fill="url(#goldGrad)"/>
  
  <!-- Spire Cross -->
  <rect x="597" y="15" width="6" height="35" fill="#fef08a" />
  <rect x="587" y="24" width="26" height="6" fill="#fef08a" />

  <!-- Columns -->
  <rect x="450" y="380" width="24" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <rect x="510" y="380" width="24" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <rect x="666" y="380" width="24" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <rect x="726" y="380" width="24" height="240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="2"/>

  <!-- Main Double Entrance Doors -->
  <rect x="560" y="490" width="80" height="130" fill="#475569" rx="4"/>
  <rect x="565" y="495" width="33" height="125" fill="#1e293b" />
  <rect x="602" y="495" width="33" height="125" fill="#1e293b" />
  <!-- Door Handles -->
  <circle cx="594" cy="560" r="3" fill="#fbbf24"/>
  <circle cx="606" cy="560" r="3" fill="#fbbf24"/>

  <!-- Architectural Fanlight above doors -->
  <path d="M560,490 A40,40 0 0,1 640,490 Z" fill="#fef3c7" stroke="#78350f" stroke-width="2" />
  <line x1="600" y1="450" x2="600" y2="490" stroke="#78350f" stroke-width="2"/>
  <line x1="575" y1="465" x2="600" y2="490" stroke="#78350f" stroke-width="2"/>
  <line x1="625" y1="465" x2="600" y2="490" stroke="#78350f" stroke-width="2"/>

  <!-- Landscaping Trees -->
  <ellipse cx="160" cy="530" rx="55" ry="90" fill="#15803d" />
  <ellipse cx="140" cy="520" rx="40" ry="70" fill="#16a34a" />
  <rect x="155" y="580" width="10" height="60" fill="#78350f" />

  <ellipse cx="1040" cy="530" rx="55" ry="90" fill="#15803d" />
  <ellipse cx="1060" cy="520" rx="40" ry="70" fill="#16a34a" />
  <rect x="1035" y="580" width="10" height="60" fill="#78350f" />

  <!-- Modern Placeholder Badge Overlay -->
  <g transform="translate(60, 60)">
    <rect width="360" height="64" rx="8" fill="#0f172a" opacity="0.85" />
    <circle cx="36" cy="32" r="16" fill="#3b82f6" />
    <path d="M30 32 L34 36 L42 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PHOTO PLACEHOLDER</text>
    <text x="64" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Replace with High-Res Exterior (1200x800)</text>
  </g>
  
  <g transform="translate(600, 750)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" letter-spacing="2">ALBEMARLE CHURCH OF CHRIST • EST. 1949</text>
  </g>
</svg>