<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="hallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="warmLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#hallGrad)"/>

  <!-- Overhead Arch Ceiling -->
  <path d="M0,0 Q600,300 1200,0 L1200,800 L0,800 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Ambient Light Cone from Cross / Center -->
  <polygon points="600,100 200,800 1000,800" fill="url(#warmLight)"/>

  <!-- Back Wall Cross -->
  <rect x="588" y="160" width="24" height="200" fill="#d97706" rx="4"/>
  <rect x="540" y="210" width="120" height="24" fill="#d97706" rx="4"/>

  <!-- Elevated Pulpit / Stage Platform -->
  <polygon points="300,560 900,560 1000,640 200,640" fill="#334155" />
  <polygon points="200,640 1000,640 1100,800 100,800" fill="#1e293b" />

  <!-- Wooden Pulpit / Lectern -->
  <polygon points="560,490 640,490 650,580 550,580" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <polygon points="540,480 660,480 655,495 545,495" fill="#d97706" />
  
  <!-- Open Bible on Lectern -->
  <polygon points="580,470 600,474 580,482 560,476" fill="#f8fafc" />
  <polygon points="620,470 600,474 620,482 640,476" fill="#f8fafc" />

  <!-- Communion Table -->
  <rect x="480" y="590" width="240" height="50" fill="#78350f" rx="3"/>
  <text x="600" y="622" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#fef3c7" text-anchor="middle" letter-spacing="3">THIS DO IN REMEMBRANCE OF ME</text>

  <!-- Pews (Perspective Lines) -->
  <g stroke="#64748b" stroke-width="3" opacity="0.7">
    <!-- Left Pews -->
    <line x1="80" y1="780" x2="380" y2="780" />
    <line x1="120" y1="720" x2="380" y2="720" />
    <line x1="160" y1="670" x2="380" y2="670" />

    <!-- Right Pews -->
    <line x1="820" y1="780" x2="1120" y2="780" />
    <line x1="820" y1="720" x2="1080" y2="720" />
    <line x1="820" y1="670" x2="1040" y2="670" />
  </g>

  <!-- Modern Placeholder Badge Overlay -->
  <g transform="translate(60, 60)">
    <rect width="360" height="64" rx="8" fill="#0f172a" opacity="0.85" />
    <circle cx="36" cy="32" r="16" fill="#3b82f6" />
    <path d="M30 32 L34 36 L42 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PHOTO PLACEHOLDER</text>
    <text x="64" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Replace with High-Res Sanctuary (1200x800)</text>
  </g>
</svg>